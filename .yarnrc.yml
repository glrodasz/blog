nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.10.3.cjs

# @astrojs/astro2tsx declares @emnapi/core but not @emnapi/runtime, which
# @napi-rs/wasm-runtime needs as a peer; without it `astro check` can't load.
packageExtensions:
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "^1.7.1"
