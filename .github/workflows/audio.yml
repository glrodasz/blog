name: Audio

on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
      - "scripts/audio/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every post (use after changing voices or narration rules)"
        type: boolean
        default: false

# One run at a time so two merges never race on the audio branch.
concurrency:
  group: audio-main
  cancel-in-progress: false

env:
  AUDIO_BRANCH: chore/audio-narration

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # AUDIO_PUSH_TOKEN is optional. With the default GITHUB_TOKEN the audio
      # branch and its pull request do not trigger other workflows, so the Test
      # checks stay unreported on it. Set AUDIO_PUSH_TOKEN to a personal access
      # token with `repo` scope if you want CI to run on the audio pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUDIO_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Start from the audio branch when it is still open so posts already
      # narrated there are not synthesized (and paid for) a second time.
      - name: Prepare audio branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$AUDIO_BRANCH" >/dev/null; then
            git fetch origin "$AUDIO_BRANCH"
            echo "AUDIO_BRANCH_EXISTED=true" >> "$GITHUB_ENV"
            git checkout -B "$AUDIO_BRANCH" "origin/$AUDIO_BRANCH"
            if ! git merge --no-edit "$GITHUB_SHA"; then
              # Someone edited the audio files by hand; start over from main.
              git merge --abort || true
              git checkout -B "$AUDIO_BRANCH" "$GITHUB_SHA"
            fi
          else
            git checkout -B "$AUDIO_BRANCH" "$GITHUB_SHA"
          fi

      - name: Generate narration audio
        run: node scripts/audio/generate.mjs ${{ inputs.force && '--force' || '' }}
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

      # main requires changes to go through a pull request, so the audio lands
      # on its own branch and a pull request keeps it open until it is merged.
      - name: Commit audio
        id: commit
        run: |
          git add public/audio src/data/audio-manifest.json
          if git diff --cached --quiet && git diff --quiet "$GITHUB_SHA" -- public/audio src/data/audio-manifest.json; then
            echo "No audio changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(audio): regenerate narration"
          fi
          if [ "${AUDIO_BRANCH_EXISTED:-false}" = "true" ]; then
            git push --force-with-lease="$AUDIO_BRANCH:$(git rev-parse "origin/$AUDIO_BRANCH")" origin "HEAD:$AUDIO_BRANCH"
          else
            git push origin "HEAD:$AUDIO_BRANCH"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUDIO_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.AUDIO_BRANCH
            const open = await github.rest.pulls.list({
              ...context.repo,
              head: `${context.repo.owner}:${head}`,
              state: "open",
            })
            if (open.data.length > 0) {
              core.notice(`Updated pull request #${open.data[0].number} with the new narration.`)
              return
            }
            const pr = await github.rest.pulls.create({
              ...context.repo,
              head,
              base: context.payload.repository.default_branch,
              title: "chore(audio): regenerate narration",
              body: [
                "Narration generated by the Audio workflow for the posts changed on `main`.",
                "",
                "Merge to publish the MP3s; Netlify redeploys with the new files.",
              ].join("\n"),
            })
            core.notice(`Opened pull request #${pr.data.number} with the new narration.`)
